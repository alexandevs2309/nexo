[package]
name = "basilisco"
version = "0.6.0"
edition = "2024"
description = "Intérprete del lenguaje de programación BASILISCO"
license = "Apache-2.0"
repository = "https://github.com/alexandevs2309/nexo"
readme = "README.md"
keywords = ["interpreter", "programming-language"]
categories = ["command-line-utilities"]
exclude = [".agents/**"]
autobins = false
default-run = "basilisco"

[[bin]]
name = "basilisco"
path = "src/main.rs"

[[bin]]
name = "bsk"
path = "src/bin/bsk.rs"

[dependencies]
