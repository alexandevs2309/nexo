[package]
name = "basilisco"
version = "0.6.0"
edition = "2024"
description = "Intérprete del lenguaje de programación BASILISCO"
license = "Apache-2.0"
repository = "https://github.com/alexandevs2309/nexo"
readme = "README.md"
keywords = ["interpreter", "programming-language"]
categories = ["command-line-utilities"]
exclude = [".agents/**"]
autobins = false
default-run = "basilisco"

[[bin]]
name = "basilisco"
path = "src/main.rs"

[[bin]]
name = "bsk"
path = "src/bin/bsk.rs"

[[bin]]
name = "basilisco-registry"
path = "src/bin/basilisco-registry.rs"

[dependencies]
base64 = "0.22"
ed25519-dalek = "3.0"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.5"
zip = "9.1"
axum = "0.8.9"
sqlx = { version = "0.9.0", features = ["runtime-tokio","tls-rustls","postgres","uuid","chrono","migrate","macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
argon2 = "0.6.0"
jsonwebtoken = "11.1.0"
tracing-subscriber = "0.3.23"
hex = "0.4.3"
tracing = "0.1.44"
