services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: basilisco
      POSTGRES_USER: basilisco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    volumes:
      - registry-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basilisco -d basilisco"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  registry:
    build:
      context: .
      dockerfile: Dockerfile.registry
    environment:
      DATABASE_URL: postgres://basilisco:${POSTGRES_PASSWORD}@db:5432/basilisco
      BASILISCO_BIND: 0.0.0.0:8080
      BASILISCO_ARTIFACTS: /var/lib/basilisco/artifacts
      BASILISCO_REGISTRY_ID: ${BASILISCO_REGISTRY_ID:?define BASILISCO_REGISTRY_ID en .env}
      RUST_LOG: info
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - registry-artifacts:/var/lib/basilisco/artifacts
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O - http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  registry-db:
  registry-artifacts:
